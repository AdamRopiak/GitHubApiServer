spring.application.name=GitHubApiServer

external.api.server.url=api.github.com
external.api.server.scheme=https
external.api.server.port=443
external.api.server.userpath=/users
external.api.server.repospath=/repos
external.api.server.branchespath=/branches

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.show-sql=true
spring.datasource.url=jdbc:postgresql://localhost:54321/postgres
spring.datasource.username=user
spring.datasource.password=admin

